# Render blueprint for the Cloudbase backend.
# Create via Render Dashboard -> New -> Blueprint, pointing at this repo.
services:
  - type: web
    name: cloudbase-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      # Secrets — set these in the Render dashboard (sync:false keeps them out of git).
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      # Non-secret config.
      - key: STORAGE_BUCKET
        value: user-files
      - key: CORS_ORIGINS
        sync: false  # set to your Vercel URL, e.g. https://cloudbase.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
